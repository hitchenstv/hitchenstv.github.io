<body>
  <div class="wrap">
    <div class="stage">
      <div class="coin" id="coin">
        <div class="face front"></div>
        <div class="face back"></div>
      </div>
    </div>
    <div class="result" id="result">&nbsp;</div>
    <button class="reset" id="resetBtn" hidden>Reset</button>
  </div>

<script>
(function(){
  "use strict";

  const coin = document.getElementById('coin');
  const resultEl = document.getElementById('result');
  const resetBtn = document.getElementById('resetBtn');

  const IDLE_DEG_PER_SEC = 25;
  const FLIP_SPINS = 8;        // fixed full turns — always "enough" to read as a real flip
  const FLIP_MS = 1600;

  let state = 'idle';          // 'idle' | 'flipping' | 'landed'
  let currentAngle = 0;
  let idleLastT = null;

  function trueRandomBit(){
    // Web Crypto's CSPRNG, not Math.random() — the result can't be predicted
    // or influenced by when/how the coin is clicked.
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] & 1; // 0 = heads, 1 = tails, equal probability
  }

  function easeOutQuart(t){ return 1 - Math.pow(1 - t, 4); }

  function idleTick(now){
    if (state !== 'idle') return;
    if (idleLastT === null) idleLastT = now;
    const dt = (now - idleLastT) / 1000;
    idleLastT = now;
    currentAngle += IDLE_DEG_PER_SEC * dt;
    coin.style.transform = `rotateY(${currentAngle}deg)`;
    requestAnimationFrame(idleTick);
  }

  function startIdle(){
    state = 'idle';
    idleLastT = null;
    coin.style.cursor = 'pointer';
    requestAnimationFrame(idleTick);
  }

  function startFlip(){
    state = 'flipping';
    coin.style.cursor = 'default';

    const isHeads = trueRandomBit() === 0;
    const landingMod = isHeads ? 0 : 180;
    const curMod = ((currentAngle % 360) + 360) % 360;
    const deltaMod = ((landingMod - curMod) % 360 + 360) % 360;
    const startAngle = currentAngle;
    const endAngle = startAngle + FLIP_SPINS * 360 + deltaMod;

    const t0 = performance.now();
    function flipTick(now){
      const t = Math.min((now - t0) / FLIP_MS, 1);
      const e = easeOutQuart(t);
      const rot = startAngle + (endAngle - startAngle) * e;
      coin.style.transform = `rotateY(${rot}deg)`;
      if (t < 1){
        requestAnimationFrame(flipTick);
      } else {
        currentAngle = endAngle;
        coin.style.transform = `rotateY(${endAngle}deg)`;
        state = 'landed';
        resultEl.textContent = isHeads ? 'Heads' : 'Tails';
        resultEl.style.visibility = 'visible';
        resetBtn.hidden = false;
      }
    }
    requestAnimationFrame(flipTick);
  }

  coin.addEventListener('click', () => {
    if (state === 'idle') startFlip();
  });

  resetBtn.addEventListener('click', () => {
    resultEl.textContent = '';
    resultEl.style.visibility = 'hidden';
    resetBtn.hidden = true;
    startIdle();
  });

  startIdle();
})();
</script>
</body>
</html>
